name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  no-vendor-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-no-vendor-files.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --locked
      - run: cargo build --locked --example capabilities
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  # The OpenCV `view` subcommand is behind the `view` feature; this job is its only build check.
  feature-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV and libclang
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --features view --all-targets -- -D warnings
      - run: cargo test --locked --features view
