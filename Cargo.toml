[package]
name = "gcam-mvsdk-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Runtime-loaded Rust bindings and CLI for the HuaTeng Vision MVSDK (GigE and USB industrial cameras)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swarmbotix/gcam-mvsdk-rs"
readme = "README.md"
keywords = ["camera", "gige", "machine-vision", "mvsdk", "huateng"]
categories = ["hardware-support", "multimedia::images", "api-bindings", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/sdk-manifest.toml",
    "/scripts/**",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/CAPABILITIES.md",
]

[lib]
name = "gcam_mvsdk_rs"
path = "src/lib.rs"

[[bin]]
name = "gcam-mvsdk-rs"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "hw"
path = "tests/hw/main.rs"

# OpenCV live view with recording (keys r, c, q; options in examples/record.yaml). Needs OpenCV
# and libclang at build time, so it is built only with `--features view`; every other target
# builds without OpenCV installed. Its tests: `cargo test --features view --example live_view`.
[[example]]
name = "live_view"
path = "examples/live_view.rs"
required-features = ["view"]

[features]
default = ["cli"]
# Downloader and installer for the vendor SDK (`setup` module).
setup = ["dep:ureq", "dep:flate2", "dep:tar", "dep:sha2", "dep:toml", "dep:humantime"]
# The `gcam-mvsdk-rs` command-line tool.
cli = ["setup", "dep:clap", "dep:png"]
# OpenCV, YAML and local time for the `live_view` example (not used by the library or the CLI).
view = ["dep:opencv", "dep:serde_yaml_ng", "dep:chrono"]

[dependencies]
libloading = "0.8"
encoding_rs = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ureq = { version = "3", default-features = false, optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"], optional = true }
humantime = { version = "2", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
png = { version = "0.18", optional = true }
opencv = { version = "0.101", default-features = false, features = ["highgui", "imgcodecs", "imgproc"], optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
